<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t d">
  <title id="t">Salt draws out the proteins, mixing tangles them, heat locks water into the network</title>
  <desc id="d">Three panels from left to right. First, separate pieces of mince with grains of salt. Second, fine threads reach out between the pieces and tangle into a mass, standing for the dissolved myofibrillar proteins. Third, the threads form a regular network with blue droplets of water in its gaps, standing for the gel that sets on heating and holds water. Notes below: 1–3% salt, a soft first set at 5–40°C (40–105°F), and no hard boil.</desc>
  <style>
    .bg { fill: var(--surface, #e9e5dc); }
    .meat { fill: #e9a89a; stroke: #b4574a; stroke-width: 1.5; }
    .salt { fill: var(--text, #24221e); }
    .strand { stroke: var(--primary, #b83e30); stroke-width: 2; fill: none; stroke-linecap: round; }
    .water { fill: #9cc3d9; fill-opacity: .8; }
    .arrow { stroke: var(--muted, #625d53); stroke-width: 2; fill: none; }
    .label { font: 15px "Helvetica Neue", Arial, "Source Han Sans SC", sans-serif; fill: var(--text, #24221e); }
    .muted { fill: var(--muted, #625d53); font-size: 13px; }
    .border { stroke: var(--border, #d3ccbe); stroke-width: 2; fill: none; }
  </style>
  <rect class="bg" width="600" height="400" rx="12"/>
  <text class="label" x="32" y="40">How mince becomes a springy gel</text>

  <!-- panel 1: separate pieces + salt -->
  <text class="label" x="100" y="80" text-anchor="middle">Mince plus salt</text>
  <g>
    <rect class="meat" x="50" y="110" width="28" height="22" rx="6"/>
    <rect class="meat" x="96" y="100" width="30" height="24" rx="6"/>
    <rect class="meat" x="140" y="118" width="26" height="22" rx="6"/>
    <rect class="meat" x="60" y="160" width="30" height="24" rx="6"/>
    <rect class="meat" x="108" y="150" width="28" height="22" rx="6"/>
    <rect class="meat" x="146" y="170" width="26" height="22" rx="6"/>
    <rect class="meat" x="80" y="206" width="30" height="22" rx="6"/>
    <rect class="meat" x="126" y="200" width="28" height="24" rx="6"/>
  </g>
  <g class="salt">
    <rect x="88" y="140" width="4" height="4"/><rect x="132" y="138" width="4" height="4"/><rect x="100" y="188" width="4" height="4"/>
    <rect x="70" y="140" width="4" height="4"/><rect x="160" y="150" width="4" height="4"/><rect x="118" y="232" width="4" height="4"/>
  </g>
  <text class="label muted" x="100" y="264" text-anchor="middle">Separate bits</text>

  <path class="arrow" d="M190 170 h26 m-8 -6 l8 6 l-8 6"/>

  <!-- panel 2: proteins pulled out and tangled -->
  <text class="label" x="300" y="80" text-anchor="middle">Mixed until sticky</text>
  <g>
    <rect class="meat" x="250" y="112" width="26" height="20" rx="6"/>
    <rect class="meat" x="318" y="108" width="26" height="20" rx="6"/>
    <rect class="meat" x="262" y="190" width="26" height="20" rx="6"/>
    <rect class="meat" x="326" y="196" width="26" height="20" rx="6"/>
  </g>
  <g class="strand">
    <path d="M276 122 C300 100 300 150 318 118"/>
    <path d="M263 132 C250 160 290 160 275 190"/>
    <path d="M331 128 C360 150 320 170 339 196"/>
    <path d="M288 200 C300 180 316 220 326 206"/>
    <path d="M270 130 C310 150 300 180 330 200"/>
    <path d="M335 130 C300 150 300 170 280 190"/>
    <path d="M250 150 C280 140 320 170 352 150"/>
  </g>
  <text class="label muted" x="300" y="264" text-anchor="middle">Dissolved proteins tangle</text>

  <path class="arrow" d="M384 170 h26 m-8 -6 l8 6 l-8 6"/>

  <!-- panel 3: heated gel network holding water -->
  <text class="label" x="500" y="80" text-anchor="middle">Heated into a gel</text>
  <g class="strand">
    <path d="M440 110 H560 M440 150 H560 M440 190 H560 M440 230 H560"/>
    <path d="M440 110 V230 M480 110 V230 M520 110 V230 M560 110 V230"/>
  </g>
  <g class="water">
    <circle cx="460" cy="130" r="9"/><circle cx="500" cy="130" r="9"/><circle cx="540" cy="130" r="9"/>
    <circle cx="460" cy="170" r="9"/><circle cx="500" cy="170" r="9"/><circle cx="540" cy="170" r="9"/>
    <circle cx="460" cy="210" r="9"/><circle cx="500" cy="210" r="9"/><circle cx="540" cy="210" r="9"/>
  </g>
  <text class="label muted" x="500" y="264" text-anchor="middle">Water held in the gaps</text>

  <path class="border" d="M32 296 H568"/>
  <text class="label muted" x="32" y="326">Salt: fish-paste products usually use 1–3%; without it, no gel.</text>
  <text class="label muted" x="32" y="352">Water: add in lots, each one taken up before the next.</text>
  <text class="label muted" x="32" y="378">Temperature: a soft first set at 5–40°C (40–105°F); no hard boil at the end.</text>
</svg>
