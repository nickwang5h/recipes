<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="t d" data-narrow="340 380">
  <title id="t">The longer a syrup cooks, the less water it holds, the hotter it gets and the harder it sets</title>
  <desc id="d">A vertical thermometer marked from bottom to top: thread 110–113°C (230–235°F), soft ball 113–116°C (235–240°F), firm ball 118–121°C (245–250°F), hard ball 121–129°C (250–265°F), soft crack 132–143°C (270–290°F), hard crack 149–154°C (300–310°F); above that, no water left at 160°C (320°F), browning at 170°C (340°F), burnt and bitter above 177°C (350°F). Beside each stage, what a drop does in cold water and the sugar concentration. The column shifts from clear to amber to dark brown.</desc>
  <style>
    .bg { fill: var(--surface, #e9e5dc); }
    .tube { fill: none; stroke: var(--text, #24221e); stroke-width: 2; }
    .tick { stroke: var(--text, #24221e); stroke-width: 2; }
    .label { font: 15px "Helvetica Neue", Arial, "Source Han Sans SC", sans-serif; fill: var(--text, #24221e); }
    .muted { fill: var(--muted, #625d53); font-size: 13px; }
    .strong { fill: var(--primary, #b83e30); }
    .border { stroke: var(--border, #d3ccbe); stroke-width: 2; fill: none; }
  </style>
  <rect class="bg" width="600" height="440" rx="12"/>
  <g class="lead">
    <text class="label" x="32" y="40">Hotter means less water and a harder set</text>
  </g>

  <!-- syrup colour column: clear at bottom, amber and brown at top.
       Wide: rows sit at their place on the scale, the words for each stage on the right.
       Phone: one row per stage, evenly spaced, the words under the temperature; the column is drawn
       again in phone coordinates so its ticks and colours meet the moved rows. -->
  <g class="wide-only">
    <rect x="60" y="66" width="34" height="330" rx="6" fill="#f6eed6"/>
    <rect x="60" y="66" width="34" height="62" fill="#c98a2b"/>
    <rect x="60" y="66" width="34" height="26" fill="#7a3d14"/>
    <rect x="60" y="128" width="34" height="34" fill="#e8c27a"/>
    <rect class="tube" x="60" y="66" width="34" height="330" rx="6"/>
    <g class="tick">
      <path d="M94 372 h14 M94 336 h14 M94 311 h14 M94 286 h14 M94 230 h14 M94 176 h14 M94 146 h14 M94 116 h14 M94 84 h14"/>
    </g>
  </g>
  <g class="narrow-only">
    <rect x="16" y="8" width="26" height="364" rx="6" fill="#f6eed6"/>
    <path d="M16 112 V14 a6 6 0 0 1 6 -6 h14 a6 6 0 0 1 6 6 V112 Z" fill="#e8c27a"/>
    <path d="M16 70 V14 a6 6 0 0 1 6 -6 h14 a6 6 0 0 1 6 6 V70 Z" fill="#c98a2b"/>
    <path d="M16 34 V14 a6 6 0 0 1 6 -6 h14 a6 6 0 0 1 6 6 V34 Z" fill="#7a3d14"/>
    <rect class="tube" x="16" y="8" width="26" height="364" rx="6"/>
    <path class="tick" d="M42 19 h10 M42 49 h10 M42 91 h10 M42 133 h10 M42 175 h10 M42 217 h10 M42 259 h10 M42 301 h10 M42 343 h10"/>
  </g>

  <text class="label" x="118" y="377" data-narrow="-60 -29">110–113°C (230–235°F)</text>
  <text class="label muted" x="320" y="377" data-narrow="-262 -10">Thread, ~80%: no ball</text>

  <text class="label" x="118" y="341" data-narrow="-60 -35">113–116°C (235–240°F)</text>
  <text class="label muted" x="320" y="341" data-narrow="-262 -16">Soft ball, ~85%: flattens</text>

  <text class="label" x="118" y="316" data-narrow="-60 -52">118–121°C (245–250°F)</text>
  <text class="label muted" x="320" y="316" data-narrow="-262 -33">Firm ball, ~87%: squeezes flat</text>

  <text class="label" x="118" y="291" data-narrow="-60 -69">121–129°C (250–265°F)</text>
  <text class="label muted" x="320" y="291" data-narrow="-262 -50">Hard ball, ~92%: squashes</text>

  <text class="label" x="118" y="235" data-narrow="-60 -55">132–143°C (270–290°F)</text>
  <text class="label muted" x="320" y="235" data-narrow="-262 -36">Soft crack, ~95%: bends, breaks</text>

  <text class="label" x="118" y="181" data-narrow="-60 -43">149–154°C (300–310°F)</text>
  <text class="label muted" x="320" y="181" data-narrow="-262 -24">Hard crack, ~99%: snaps</text>

  <text class="label" x="118" y="151" data-narrow="-60 -55">~160°C (320°F)</text>
  <text class="label muted" x="320" y="151" data-narrow="-262 -36">No water left, light amber</text>

  <text class="label" x="118" y="121" data-narrow="-60 -67">~170°C (340°F)</text>
  <text class="label muted" x="320" y="121" data-narrow="-262 -48">Starts to brown</text>

  <text class="label strong" x="118" y="89" data-narrow="-60 -65">Above ~177°C (350°F): burnt, bitter</text>

  <path class="border wide-only" d="M32 410 H568"/>
  <g class="notes">
    <text class="label muted" x="32" y="430">Sea-level figures. Test the thermometer in boiling water: 100°C (212°F).</text>
  </g>
</svg>
