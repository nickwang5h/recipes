<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-labelledby="t d" data-narrow="340 606">
  <title id="t">Microbes and enzymes turn raw ingredients into flavour</title>
  <desc id="d">Left to right: the ingredient, the microbe or the enzyme it makes, and the product. Lactic acid bacteria and yeast use sugar to make acid, or alcohol and gas. Proteases from moulds and other microbes break down protein, releasing the free amino acids that bring umami.</desc>
  <style>
    .bg { fill: var(--surface, #e9e5dc); }
    .label { font: 15px "Helvetica Neue", Arial, "Source Han Sans SC", sans-serif; fill: var(--text, #24221e); }
    .muted { fill: var(--muted, #625d53); font-size: 13px; }
    .line { stroke: var(--text, #24221e); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .guide { stroke: var(--border, #d3ccbe); stroke-width: 1.5; }
    .sugar { fill: var(--accent-yellow, #a66b00); fill-opacity: .2; stroke: var(--accent-yellow, #a66b00); stroke-width: 2; }
    .bacteria { fill: var(--accent-green, #2f8359); }
    .yeast { fill: var(--accent-blue, #2f6fca); }
    .enzyme { stroke: var(--primary, #b83e30); stroke-width: 2; fill: none; }
    .amino { fill: var(--primary, #b83e30); }
  </style>
  <defs>
    <g id="sugar">
      <rect class="sugar" x="-12" y="-12" width="24" height="24" rx="3"/>
    </g>
    <g id="arrow">
      <path class="line" d="M0 0 H30 M22 -7 L30 0 L22 7"/>
    </g>
  </defs>
  <rect class="bg" width="600" height="460" rx="12"/>
  <!-- Wide: a table, one row per route. Phone: one block per route, the product under its microbe. -->
  <g class="lead" data-join=" → ">
    <text class="label" x="94" y="39" text-anchor="middle">Ingredient</text>
    <text class="label" x="287" y="39" text-anchor="middle">Microbes and enzymes</text>
    <text class="label" x="488" y="39" text-anchor="middle">Products and flavour</text>
  </g>
  <line class="guide wide-only" x1="32" y1="58" x2="568" y2="58"/>
  <g class="narrow-only">
    <path class="line" d="M210 104 V126 M203 119 L210 126 L217 119 M210 286 V308 M203 301 L210 308 L217 301 M210 477 V499 M203 492 L210 499 L217 492"/>
    <path class="guide" d="M20 188 H320 M20 372 H320"/>
  </g>

  <g data-narrow="-45 -63">
    <use href="#sugar" x="78" y="101"/>
    <use href="#sugar" x="109" y="119"/>
    <text class="label" x="94" y="157" text-anchor="middle">Sugar</text>
    <use href="#arrow" x="156" y="115"/>
  </g>
  <g data-narrow="-77 -63">
    <rect class="bacteria" x="260" y="91" width="39" height="15" rx="7.5" transform="rotate(-20 280 98)"/>
    <rect class="bacteria" x="285" y="113" width="35" height="15" rx="7.5" transform="rotate(15 302 120)"/>
    <text class="label" x="287" y="157" text-anchor="middle">Lactic acid bacteria</text>
  </g>
  <g class="wide-only"><use href="#arrow" x="380" y="115"/></g>
  <g data-narrow="-222 36">
    <text class="label narrow-middle" x="432" y="110">Organic acids</text>
    <text class="label muted narrow-middle" x="432" y="136">Lactic acid: sour</text>
  </g>

  <g data-narrow="-45 12">
    <use href="#sugar" x="78" y="208"/>
    <use href="#sugar" x="109" y="226"/>
    <text class="label" x="94" y="264" text-anchor="middle">Sugar</text>
    <use href="#arrow" x="156" y="222"/>
  </g>
  <g data-narrow="-77 12">
    <circle class="yeast" cx="280" cy="218" r="15"/>
    <circle class="yeast" cx="299" cy="205" r="9"/>
    <text class="label" x="287" y="264" text-anchor="middle">Yeast</text>
  </g>
  <g class="wide-only"><use href="#arrow" x="380" y="222"/></g>
  <g data-narrow="-222 120">
    <text class="label narrow-middle" x="432" y="210">Alcohol, CO2</text>
    <text class="label muted narrow-middle" x="432" y="236">Also forms aroma</text>
  </g>

  <line class="guide wide-only" x1="32" y1="282" x2="568" y2="282"/>
  <g data-narrow="-45 94">
    <path class="line" d="M57 330 L76 315 L96 335 L117 318 L136 332"/>
    <circle class="sugar" cx="57" cy="330" r="5"/>
    <circle class="sugar" cx="76" cy="315" r="5"/>
    <circle class="sugar" cx="96" cy="335" r="5"/>
    <circle class="sugar" cx="117" cy="318" r="5"/>
    <circle class="sugar" cx="136" cy="332" r="5"/>
    <text class="label" x="94" y="373" text-anchor="middle">Protein</text>
    <use href="#arrow" x="156" y="330"/>
  </g>
  <g data-narrow="-77 94">
    <path class="enzyme" d="M287 345 V307 M287 325 L266 312 M287 333 L309 316"/>
    <circle class="amino" cx="287" cy="304" r="4"/>
    <circle class="amino" cx="264" cy="310" r="4"/>
    <circle class="amino" cx="311" cy="314" r="4"/>
    <text class="label" x="287" y="373" text-anchor="middle">Proteases from moulds</text>
  </g>
  <g class="wide-only"><use href="#arrow" x="380" y="330"/></g>
  <g data-narrow="-278 192">
    <circle class="amino" cx="449" cy="322" r="5"/>
    <circle class="amino" cx="479" cy="332" r="5"/>
    <circle class="amino" cx="514" cy="317" r="5"/>
    <text class="label" x="488" y="373" text-anchor="middle">Free amino acids</text>
    <text class="label muted" x="488" y="398" text-anchor="middle">e.g. glutamate: umami</text>
  </g>
  <g class="notes">
    <text class="label muted" x="32" y="437">Enzymes break down the protein; koji and later fermentation can differ.</text>
  </g>
</svg>
