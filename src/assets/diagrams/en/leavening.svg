<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 446" role="img" aria-labelledby="t d" data-narrow="340 516">
  <title id="t">Get gas in and hold it; heat expands the bubbles, turns water to steam, then sets them</title>
  <desc id="d">On the left, three sources of gas before heating, one small picture each: budding yeast giving off little bubbles, a small heap of baking soda fizzing where a drop of acid lands, and a whisk trailing a string of bubbles; the three arrows meet at the middle. In the middle, small bubbles held by a gluten network. On the right, bubbles enlarged by heat, with steam inside and firm walls. Below, the temperatures at which yeast ferments fastest and dies, baking powder's two releases of gas, the centre of a just-baked loaf at about 93°C, and the steam the dough's water turns into as it heats.</desc>
  <style>
    .bg { fill: var(--surface, #e9e5dc); }
    .line { stroke: var(--text, #24221e); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dough { fill: #e8d3a8; stroke: var(--text, #24221e); stroke-width: 2; }
    .net { stroke: var(--accent-green, #2f8359); stroke-width: 1.6; fill: none; stroke-linecap: round; }
    .bubble { fill: var(--surface, #e9e5dc); stroke: var(--accent-blue, #2f6fca); stroke-width: 2; }
    .set { fill: var(--surface, #e9e5dc); stroke: #a8692a; stroke-width: 3; }
    .yeast { fill: var(--accent-blue, #2f6fca); }
    .powder { fill: #fbf9f3; stroke: var(--muted, #625d53); stroke-width: 1.5; stroke-linejoin: round; }
    .acid { fill: #e6cb5c; stroke: #9a7d14; stroke-width: 1.5; }
    .whisk { stroke: var(--text, #24221e); stroke-width: 1.6; fill: none; stroke-linecap: round; }
    .handle { stroke: var(--text, #24221e); stroke-width: 5; stroke-linecap: round; }
    .steam { stroke: var(--muted, #625d53); stroke-width: 1.6; fill: none; stroke-linecap: round; }
    .border { stroke: var(--border, #d3ccbe); stroke-width: 2; fill: none; }
    .label { font: 15px "Helvetica Neue", Arial, "Source Han Sans SC", sans-serif; fill: var(--text, #24221e); }
    .muted { fill: var(--muted, #625d53); font-size: 13px; }
  </style>
  <defs>
    <path id="wisp" class="steam" d="M0 7 q-3 -3.5 0 -7 q3 -3.5 0 -7 M6 7 q-3 -3.5 0 -7 q3 -3.5 0 -7"/>
  </defs>
  <rect class="bg" width="600" height="446" rx="12"/>
  <!-- Wide: three columns left to right. Phone: the sources on top, then each stage as a row, the dough on the
       left and its words beside it, joined by downward arrows. -->
  <g class="lead">
    <text class="label" x="32" y="42">Make gas, hold it, then let heat expand and set it</text>
  </g>
  <g class="narrow-only">
    <path class="line" d="M82 172 V196 M75 189 L82 196 L89 189 M82 332 V358 M75 351 L82 358 L89 351"/>
  </g>

  <!-- Three sources, each a small picture and its words; the bubbles are the ones the dough holds. -->
  <text class="label narrow-start" x="118" y="84" text-anchor="middle" data-narrow="-102 -58">Gas before heating</text>
  <g data-narrow="-14 -60">
    <!-- yeast budding (as in the fermentation diagram), giving off bubbles -->
    <circle class="yeast" cx="46" cy="128" r="10.5"/>
    <circle class="yeast" cx="59" cy="119" r="6.3"/>
    <circle class="bubble" cx="71" cy="125" r="4"/>
    <circle class="bubble" cx="78" cy="113" r="4.5"/>
    <circle class="bubble" cx="85" cy="124" r="3.5"/>
    <text class="label muted" x="98" y="129">Yeast makes gas</text>

    <!-- a little heap of baking soda, a drop of acid, fizzing where they meet -->
    <path class="powder" d="M31 180 Q35 167 45 163 Q55 167 59 180 Z"/>
    <path class="acid" d="M66 143 Q71 151 71 154 A5 5 0 0 1 61 154 Q61 151 66 143 Z"/>
    <circle class="bubble" cx="64" cy="168" r="3.5"/>
    <circle class="bubble" cx="73" cy="175" r="4"/>
    <circle class="bubble" cx="78" cy="164" r="3.5"/>
    <circle class="bubble" cx="86" cy="173" r="3"/>
    <text class="label muted" x="98" y="173">Soda meets acid</text>

    <!-- a balloon whisk trailing a string of bubbles -->
    <path class="handle" d="M33 212 H43"/>
    <path class="whisk" d="M44 212 C52 197 72 199 72 212 C72 225 52 227 44 212 M44 212 C52 204 65 205 65 212 C65 219 52 220 44 212 M44 212 H72"/>
    <circle class="bubble" cx="78" cy="205" r="3"/>
    <circle class="bubble" cx="81" cy="216" r="3.5"/>
    <circle class="bubble" cx="88" cy="208" r="3"/>
    <text class="label muted" x="98" y="217">Whipping adds air</text>
  </g>

  <path class="line wide-only" d="M210 124 L228 168 M210 212 L228 168 M210 168 H240 M233 161 L240 168 L233 175"/>

  <text class="label narrow-start" x="316" y="84" text-anchor="middle" data-narrow="-152 140">Gluten holds the bubbles</text>
  <g data-narrow="-234 96">
    <rect class="dough" x="246" y="108" width="140" height="120" rx="20"/>
    <path class="net" d="M252 130 Q290 118 316 134 T380 128 M252 168 Q290 156 316 172 T380 166 M252 206 Q290 194 316 210 T380 204 M270 112 Q260 168 272 226 M316 110 Q330 168 314 226 M360 112 Q350 168 364 226"/>
    <circle class="bubble" cx="292" cy="150" r="7"/>
    <circle class="bubble" cx="340" cy="146" r="6"/>
    <circle class="bubble" cx="300" cy="196" r="6"/>
    <circle class="bubble" cx="348" cy="188" r="8"/>
    <circle class="bubble" cx="270" cy="176" r="5"/>
  </g>
  <text class="label muted narrow-start" x="316" y="252" text-anchor="middle" data-narrow="-152 -4">In cakes: egg protein</text>

  <path class="line wide-only" d="M400 168 H426 M418 160 L426 168 L418 176"/>
  <text class="label muted narrow-start" x="413" y="146" text-anchor="middle" data-narrow="-319 202">Heat</text>

  <text class="label narrow-start" x="502" y="84" text-anchor="middle" data-narrow="-338 302">Bubbles grow, walls set</text>
  <g data-narrow="-420 266">
    <rect class="dough" x="440" y="100" width="124" height="136" rx="24"/>
    <circle class="set" cx="476" cy="140" r="16"/>
    <circle class="set" cx="530" cy="136" r="14"/>
    <circle class="set" cx="486" cy="198" r="15"/>
    <circle class="set" cx="536" cy="194" r="17"/>
    <!-- steam from the dough's water, inside the bubbles -->
    <use href="#wisp" x="473" y="140"/>
    <use href="#wisp" x="527" y="136"/>
    <use href="#wisp" x="483" y="198"/>
    <use href="#wisp" x="533" y="194"/>
  </g>
  <text class="label muted narrow-start" x="502" y="260" text-anchor="middle" data-narrow="-338 150">Protein sets, starch gels</text>

  <path class="border wide-only" d="M32 296 H568"/>
  <g class="notes">
    <text class="label muted" x="32" y="326">About 27–35°C (80–95°F): yeast ferments fastest.</text>
    <text class="label muted" x="32" y="352">About 55–60°C (130–140°F): yeast dies and stops making gas.</text>
    <text class="label muted" x="32" y="378">Baking powder: part reacts when wet, part only when wet and hot.</text>
    <text class="label muted" x="32" y="404">About 93°C (200°F): the centre of a just-baked loaf.</text>
    <g>
      <g class="key" data-key="30 417 16 18"><path class="steam" d="M35 433 q-3 -3.5 0 -7 q3 -3.5 0 -7 M41 433 q-3 -3.5 0 -7 q3 -3.5 0 -7"/></g>
      <text class="label muted" x="52" y="430">Steam: as the dough heats, its water turns to steam and lifts it too.</text>
    </g>
  </g>
</svg>
