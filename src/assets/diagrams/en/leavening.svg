<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="t d">
  <title id="t">Gas comes from three sources, is held by gluten, then expands and sets with heat</title>
  <desc id="d">On the left, three sources of gas: yeast fermenting gives carbon dioxide, baking soda meeting acid gives carbon dioxide, and whipping beats in air. In the middle, small bubbles held by a gluten network. On the right, bubbles enlarged by heat, with firm walls. Below, the temperatures at which yeast is most active and at which it dies.</desc>
  <style>
    .bg { fill: var(--surface, #e9e5dc); }
    .line { stroke: var(--text, #24221e); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dough { fill: #e8d3a8; stroke: var(--text, #24221e); stroke-width: 2; }
    .net { stroke: var(--accent-green, #2f8359); stroke-width: 1.6; fill: none; stroke-linecap: round; }
    .bubble { fill: var(--surface, #e9e5dc); stroke: var(--accent-blue, #2f6fca); stroke-width: 2; }
    .set { fill: var(--surface, #e9e5dc); stroke: #a8692a; stroke-width: 3; }
    .gas { fill: var(--primary, #b83e30); }
    .border { stroke: var(--border, #d3ccbe); stroke-width: 2; fill: none; }
    .label { font: 15px "Helvetica Neue", Arial, "Source Han Sans SC", sans-serif; fill: var(--text, #24221e); }
    .muted { fill: var(--muted, #625d53); font-size: 13px; }
  </style>
  <rect class="bg" width="600" height="420" rx="12"/>
  <text class="label" x="32" y="42">Make gas, hold it, then let heat expand and set it</text>

  <text class="label" x="92" y="84" text-anchor="middle">Where gas comes from</text>
  <ellipse class="line" cx="50" cy="118" rx="14" ry="10"/>
  <circle class="gas" cx="78" cy="110" r="4"/>
  <circle class="gas" cx="90" cy="120" r="3"/>
  <text class="label muted" x="102" y="124">Yeast eats sugar</text>
  <path class="line" d="M38 168 h22 M49 157 v22"/>
  <text class="label muted" x="66" y="174">Soda + acid</text>
  <circle class="gas" cx="148" cy="160" r="4"/>
  <path class="line" d="M40 212 q12 -22 24 0 q12 22 24 0"/>
  <text class="label muted" x="96" y="218">Whipping adds air</text>

  <path class="line" d="M196 168 H222 M214 160 L222 168 L214 176"/>

  <text class="label" x="316" y="84" text-anchor="middle">Gluten holds the bubbles</text>
  <rect class="dough" x="246" y="108" width="140" height="120" rx="20"/>
  <path class="net" d="M252 130 Q290 118 316 134 T380 128 M252 168 Q290 156 316 172 T380 166 M252 206 Q290 194 316 210 T380 204 M270 112 Q260 168 272 226 M316 110 Q330 168 314 226 M360 112 Q350 168 364 226"/>
  <circle class="bubble" cx="292" cy="150" r="7"/>
  <circle class="bubble" cx="340" cy="146" r="6"/>
  <circle class="bubble" cx="300" cy="196" r="6"/>
  <circle class="bubble" cx="348" cy="188" r="8"/>
  <circle class="bubble" cx="270" cy="176" r="5"/>
  <text class="label muted" x="316" y="252" text-anchor="middle">In cakes: egg protein</text>

  <path class="line" d="M400 168 H426 M418 160 L426 168 L418 176"/>
  <text class="label muted" x="413" y="146" text-anchor="middle">Heat</text>

  <text class="label" x="502" y="84" text-anchor="middle">Bubbles grow, walls set</text>
  <rect class="dough" x="440" y="100" width="124" height="136" rx="24"/>
  <circle class="set" cx="476" cy="140" r="16"/>
  <circle class="set" cx="530" cy="136" r="14"/>
  <circle class="set" cx="486" cy="198" r="15"/>
  <circle class="set" cx="536" cy="194" r="17"/>
  <text class="label muted" x="502" y="260" text-anchor="middle">Protein sets, starch gels</text>

  <path class="border" d="M32 296 H568"/>
  <text class="label muted" x="32" y="326">About 27–35°C (80–95°F): yeast ferments fastest.</text>
  <text class="label muted" x="32" y="352">About 55–60°C (130–140°F): yeast dies and stops making gas.</text>
  <text class="label muted" x="32" y="378">Baking powder: part reacts when wet, part only when wet and hot.</text>
  <text class="label muted" x="32" y="404">About 93°C (200°F): the centre of a just-baked loaf.</text>
</svg>
