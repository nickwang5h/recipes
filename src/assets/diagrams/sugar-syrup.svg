<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="t d" data-narrow="340 380">
  <title id="t">糖浆熬得越久，水越少、温度越高，凉下来越硬</title>
  <desc id="d">一根竖着的温度计，从下往上标出拉丝 110–113°C、软球 113–116°C、中球 118–121°C、硬球 121–129°C、软脆 132–143°C、硬脆 149–154°C，再往上 160°C 没有水、170°C 变褐、177°C 以上焦苦。右边写着每一档滴进冷水的样子和糖的浓度，颜色从透明渐渐变成琥珀和深褐。</desc>
  <style>
    .bg { fill: var(--surface, #e9e5dc); }
    .tube { fill: none; stroke: var(--text, #24221e); stroke-width: 2; }
    .tick { stroke: var(--text, #24221e); stroke-width: 2; }
    .label { font: 15px "Source Han Sans SC", "PingFang SC", sans-serif; fill: var(--text, #24221e); }
    .muted { fill: var(--muted, #625d53); font-size: 13px; }
    .strong { fill: var(--primary-strong, #9e3529); }
    .border { stroke: var(--border, #d3ccbe); stroke-width: 2; fill: none; }
  </style>
  <rect class="bg" width="600" height="440" rx="12"/>
  <g class="lead">
    <text class="label" x="32" y="40">温度越高，水越少，凉了越硬</text>
  </g>

  <!-- syrup colour column: clear at bottom, amber and brown at top.
       Wide: rows sit at their place on the scale, the words for each stage on the right.
       Phone: one row per stage, evenly spaced, the words under the temperature; the column is drawn
       again in phone coordinates so its ticks and colours meet the moved rows. -->
  <g class="wide-only">
    <rect x="60" y="66" width="34" height="330" rx="6" fill="#f6eed6"/>
    <rect x="60" y="66" width="34" height="62" fill="#c98a2b"/>
    <rect x="60" y="66" width="34" height="26" fill="#7a3d14"/>
    <rect x="60" y="128" width="34" height="34" fill="#e8c27a"/>
    <rect class="tube" x="60" y="66" width="34" height="330" rx="6"/>
    <g class="tick">
      <path d="M94 372 h14 M94 336 h14 M94 311 h14 M94 286 h14 M94 230 h14 M94 176 h14 M94 146 h14 M94 116 h14 M94 84 h14"/>
    </g>
  </g>
  <g class="narrow-only">
    <rect x="16" y="8" width="26" height="364" rx="6" fill="#f6eed6"/>
    <path d="M16 112 V14 a6 6 0 0 1 6 -6 h14 a6 6 0 0 1 6 6 V112 Z" fill="#e8c27a"/>
    <path d="M16 70 V14 a6 6 0 0 1 6 -6 h14 a6 6 0 0 1 6 6 V70 Z" fill="#c98a2b"/>
    <path d="M16 34 V14 a6 6 0 0 1 6 -6 h14 a6 6 0 0 1 6 6 V34 Z" fill="#7a3d14"/>
    <rect class="tube" x="16" y="8" width="26" height="364" rx="6"/>
    <path class="tick" d="M42 19 h10 M42 49 h10 M42 91 h10 M42 133 h10 M42 175 h10 M42 217 h10 M42 259 h10 M42 301 h10 M42 343 h10"/>
  </g>

  <text class="label" x="118" y="377" data-narrow="-60 -29">110–113°C 拉丝</text>
  <text class="label muted" x="300" y="377" data-narrow="-242 -10">约 80%：成细丝，团不成球</text>

  <text class="label" x="118" y="341" data-narrow="-60 -35">113–116°C 软球</text>
  <text class="label muted" x="300" y="341" data-narrow="-242 -16">约 85%：软球，拿出来就摊平</text>

  <text class="label" x="118" y="316" data-narrow="-60 -52">118–121°C 中球</text>
  <text class="label muted" x="300" y="316" data-narrow="-242 -33">约 87%：不摊平，一捏就扁</text>

  <text class="label" x="118" y="291" data-narrow="-60 -69">121–129°C 硬球</text>
  <text class="label muted" x="300" y="291" data-narrow="-242 -50">约 92%：硬球，用力捏还能变形</text>

  <text class="label" x="118" y="235" data-narrow="-60 -55">132–143°C 软脆</text>
  <text class="label muted" x="300" y="235" data-narrow="-242 -36">约 95%：细丝弯一下再断</text>

  <text class="label" x="118" y="181" data-narrow="-60 -43">149–154°C 硬脆</text>
  <text class="label muted" x="300" y="181" data-narrow="-242 -24">约 99%：硬丝，一弯就断</text>

  <text class="label" x="118" y="151" data-narrow="-60 -55">约 160°C 没有水了</text>
  <text class="label muted" x="300" y="151" data-narrow="-242 -36">浅琥珀色的液体</text>

  <text class="label" x="118" y="121" data-narrow="-60 -67">约 170°C 开始变褐</text>
  <text class="label muted" x="300" y="121" data-narrow="-242 -48">焦糖化</text>

  <text class="label strong" x="118" y="89" data-narrow="-60 -65">约 177°C 以上 焦苦</text>

  <path class="border wide-only" d="M32 410 H568"/>
  <g class="notes">
    <text class="label muted" x="32" y="430">温度按海平面算；温度计先在沸水里试，应读 100°C。</text>
  </g>
</svg>
