# 食材名录：菜谱配料通过 `ref` 引用这里的 id。
# id 用英文小写连字符，一旦被引用就不改。
# where: mainstream = Loblaws/Superstore、Metro、Sobeys、Walmart、Costco 等主流超市能买到
#        asian      = 通常要去 T&T、大统华等华人/亚洲超市
#        specialty  = 专门店或网购
# pantry: 常备、耐放的调味料和干货；做"冰箱匹配"时默认家里有。
# en: 加拿大超市货架或标签上常见的英文名，方便对照采购。

